server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  client_max_body_size 20m;

  # Docker's internal DNS; the variable makes nginx resolve "api" per request,
  # so the container still starts if the API is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;

  # API routes served on the app's own domain: REST API, open/click tracking,
  # unsubscribe pages, uploaded images, health check.
  location ~ ^/(api|t|u|media|webhooks)/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }
  location = /health {
    proxy_pass $api_upstream;
  }

  # Hashed build assets: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html is never cached so new deploys show up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz { access_log off; return 200 "ok"; }
}
