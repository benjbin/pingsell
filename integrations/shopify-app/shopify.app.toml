# Configuration de l'app publique Pingsell sur Shopify.
# Après avoir créé l'app dans le Dev Dashboard : remplacez client_id, puis
#   npx @shopify/cli app config link   (choisir l'app Pingsell)
#   npx @shopify/cli app deploy
# Les mêmes valeurs peuvent aussi être saisies à la main dans le Dev Dashboard (Versions → Créer une version).

name = "Pingsell"
# Identifiant de l’app dans les URL Shopify (page des formules : admin.shopify.com/store/…/charges/pingsell/pricing_plans).
handle = "pingsell"
client_id = "2893a4c0c3383285ca6b54f7f2813b10"
# Page où Shopify envoie le marchand après « Installer » et chaque fois qu'il ouvre Pingsell depuis son admin.
application_url = "https://app.pingsell.neokrome.tech/api/v1/integrations/shopify/app"
# Pingsell s'ouvre dans l'admin Shopify (app intégrée, App Bridge) : une page d'accueil avec les chiffres
# de la boutique, et des boutons qui ouvrent Pingsell complet dans un nouvel onglet.
embedded = true

[access_scopes]
scopes = "read_customers,read_orders"
# Installation gérée par Shopify (scopes ci-dessus) ; à la première ouverture, Pingsell échange le jeton de
# session App Bridge contre un jeton hors ligne qui expire (token exchange). Le parcours OAuth classique
# (/install, redirect_urls) reste disponible pour une installation lancée depuis Pingsell.
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://app.pingsell.neokrome.tech/api/v1/integrations/shopify/callback" ]

[webhooks]
api_version = "2026-07"

  # Les webhooks de la boutique (clients, commandes, paniers, désinstallation) sont créés par l'API à la connexion.
  # Les trois webhooks de confidentialité sont obligatoires et se déclarent ici.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://app.pingsell.neokrome.tech/api/v1/webhooks/shopify"

[pos]
embedded = false
