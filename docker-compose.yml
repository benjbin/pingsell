# Pingsell on Coolify — "Docker Compose" build pack. Works with no variable set:
# Coolify generates a domain for "web" (the app, which also serves the API under /api)
# and one for "site" (the marketing site). Change them in each service's settings.
services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    # tini en PID 1 : node n'ignore plus SIGKILL envoyé par son chien de garde (API figée → redémarrage par Docker).
    init: true
    # Laisse le worker finir son lot d'envoi et la base se fermer proprement avant le SIGKILL de Docker.
    stop_grace_period: 30s
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_PATH=/data/pingsell.db
      - UPLOAD_DIR=/data/uploads
      # Public base URL for tracking links, images and invitations = the app's domain.
      - PUBLIC_URL=${PUBLIC_URL:-${SERVICE_URL_WEB}}
      - WEB_URL=${WEB_URL:-${SERVICE_URL_WEB}}
      # Self-hosted sending through the "mta" service below (no third-party email service).
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_HOST=mta
      - SMTP_PORT=2525
      - MAIL_DOMAIN=${MAIL_DOMAIN:-pingsell.neokrome.tech}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-}
      - MTA_WEBHOOK_SECRET=${MTA_WEBHOOK_SECRET:-${SERVICE_PASSWORD_MTAHOOK}}
      # IP warm-up: set the first sending day (YYYY-MM-DD) to cap the daily volume while the IP builds a reputation.
      - MAIL_WARMUP_START=${MAIL_WARMUP_START:-}
      - MAIL_WARMUP_INITIAL=${MAIL_WARMUP_INITIAL:-200}
      - MAIL_WARMUP_GROWTH=${MAIL_WARMUP_GROWTH:-1.4}
      - MAIL_WARMUP_MAX=${MAIL_WARMUP_MAX:-100000}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - PUSH_MODE=${PUSH_MODE:-live}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY:-}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
      - SHOPIFY_PARTNER_ORG_ID=${SHOPIFY_PARTNER_ORG_ID:-}
      - SHOPIFY_PARTNER_API_TOKEN=${SHOPIFY_PARTNER_API_TOKEN:-}
      - SHOPIFY_APP_ID=${SHOPIFY_APP_ID:-}
      - SHOPIFY_APP_HANDLE=${SHOPIFY_APP_HANDLE:-pingsell}
      # Platform admin dashboard: comma-separated user emails (empty = nobody).
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
      # Encrypted daily backups of the database (docs/securite). Coolify generates the key on first deploy:
      # copy it to a password manager, it is the only way to read the backups.
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-${SERVICE_PASSWORD_64_BACKUPKEY}}
      # Sauvegardes gardées sur le volume (chacune ≈ la base compressée) ; l'historique long se garde sur S3.
      - BACKUP_KEEP=${BACKUP_KEEP:-3}
      # Event loop bloquée plus longtemps que ça (ms) → le processus est tué et Docker le redémarre. 0 = désactivé.
      - WATCHDOG_TIMEOUT_MS=${WATCHDOG_TIMEOUT_MS:-60000}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-pingsell/}
    volumes:
      - pingsell-data:/data
    expose:
      - "4000"

  # Our own mail server (Postfix + DKIM): delivers to recipients on port 25 and receives
  # bounces / complaints for MAIL_DOMAIN. Needs outbound port 25 open on the host, and DNS
  # (A, MX, SPF, DKIM, DMARC, reverse DNS): the records are printed in this service's logs.
  mta:
    build:
      context: ./apps/mta
    restart: unless-stopped
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:-pingsell.neokrome.tech}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-}
      - DKIM_SELECTOR=${DKIM_SELECTOR:-pingsell}
      - MTA_WEBHOOK_SECRET=${MTA_WEBHOOK_SECRET:-${SERVICE_PASSWORD_MTAHOOK}}
      - MTA_WEBHOOK_URL=http://api:4000/webhooks/mta
    ports:
      - "25:25"
    expose:
      - "2525"
    volumes:
      - mta-data:/data
      - mta-queue:/var/spool/postfix

  web:
    build:
      context: ./apps/web
      args:
        # Empty = same origin: nginx in this container proxies /api to the api service.
        VITE_API_URL: ""
        VITE_SITE_URL: ${SITE_URL:-${SERVICE_URL_SITE}}
    restart: unless-stopped
    environment:
      - SERVICE_URL_WEB_80
    depends_on:
      - api
    expose:
      - "80"

  site:
    build:
      context: ./apps/site
      args:
        VITE_APP_URL: ${WEB_URL:-${SERVICE_URL_WEB}}
        VITE_API_URL: ${WEB_URL:-${SERVICE_URL_WEB}}/api/v1
    restart: unless-stopped
    environment:
      - SERVICE_URL_SITE_80
    expose:
      - "80"

volumes:
  pingsell-data:
  mta-data:
  mta-queue:
