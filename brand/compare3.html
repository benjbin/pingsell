<!doctype html>
<html lang="fr">
<meta charset="utf-8" />
<title>Pingsell, 3 pistes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Manrope, system-ui; background: #eef1f7; color: #0b214a; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; padding: 28px; }
  .col > h2 { font: 800 30px Outfit; text-transform: uppercase; letter-spacing: -0.03em; margin: 0 0 14px; }
  .col > h2 span { color: #145cff; }
  .card { background: #fff; border-radius: 20px; padding: 0; overflow: hidden; margin-bottom: 18px; box-shadow: 0 1px 0 rgba(11,33,74,.06); }
  .lbl { font: 600 10px Manrope; letter-spacing: .18em; text-transform: uppercase; color: #64748b; margin: 0 0 8px 4px; }

  /* app */
  .app { display: flex; height: 250px; }
  .side { width: 190px; background: #0b214a; padding: 18px 12px; }
  .side img { height: 26px; margin: 2px 6px 22px; }
  .nav div { color: #cbd5e1; font-size: 12px; padding: 7px 10px; border-radius: 10px; }
  .nav div.on { background: #145cff; color: #fff; font-weight: 600; }
  .main { flex: 1; padding: 22px 24px; }
  .main small { font: 600 9px Manrope; letter-spacing: .18em; color: #64748b; }
  .main h3 { font: 800 30px/0.95 Outfit; text-transform: uppercase; letter-spacing: -0.035em; margin: 8px 0 14px; }
  .main h3 em { font-style: normal; color: #145cff; display: block; }
  .tiles { display: flex; gap: 8px; }
  .tiles div { flex: 1; background: #f1f4fa; border-radius: 12px; padding: 10px; font-size: 9px; color: #64748b; }
  .tiles b { display: block; font: 800 20px Outfit; color: #0b214a; margin-top: 4px; }

  /* login */
  .login { padding: 26px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(#f7f9fd, #fff); }
  .login img { height: 40px; margin-bottom: 14px; }
  .login p { margin: 0 0 12px; font-size: 12px; color: #64748b; }
  .field { width: 240px; height: 32px; border-radius: 10px; border: 1px solid #dbe2ee; margin-bottom: 8px; }
  .btn { width: 240px; height: 34px; border-radius: 10px; background: #145cff; color: #fff; font: 700 12px Manrope; display: grid; place-items: center; }

  /* phone */
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .phone { background: linear-gradient(160deg, #3a4f7a, #1b2440 60%, #4a2c4e); border-radius: 20px; padding: 18px; height: 260px; position: relative; overflow: hidden; }
  .notif { background: rgba(245,245,250,.86); backdrop-filter: blur(10px); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
  .notif img { width: 30px; height: 30px; border-radius: 7px; }
  .notif .t { font: 700 11px system-ui; color: #111; display: flex; justify-content: space-between; }
  .notif .t span { font-weight: 400; color: #666; }
  .notif .b { font: 400 11px/1.3 system-ui; color: #222; margin-top: 2px; }
  .home { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; margin-top: 22px; }
  .home div { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 9px system-ui; color: #fff; }
  .home i { width: 46px; height: 46px; border-radius: 11px; display: block; background: rgba(255,255,255,.16); }
  .home img { width: 46px; height: 46px; border-radius: 11px; }

  /* browser + email */
  .tabs { background: #dfe3ea; padding: 8px 8px 0; display: flex; gap: 4px; }
  .tab { background: #eef0f4; border-radius: 9px 9px 0 0; padding: 7px 10px; font: 500 11px system-ui; color: #555; display: flex; gap: 6px; align-items: center; width: 150px; white-space: nowrap; overflow: hidden; }
  .tab.on { background: #fff; color: #111; }
  .tab img { width: 16px; height: 16px; }
  .tab i { width: 16px; height: 16px; border-radius: 4px; background: #c9ced8; display: block; }
  .mail { padding: 18px 20px; border-top: 1px solid #eef0f4; }
  .mail .from { display: flex; gap: 10px; align-items: center; font-size: 12px; }
  .mail .from img { width: 34px; height: 34px; border-radius: 50%; }
  .mail .from b { display: block; font-size: 13px; }
  .mail .from span { color: #64748b; }
  .foot { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #dbe2ee; display: flex; align-items: center; gap: 8px; font-size: 10px; color: #94a3b8; }
  .foot img { height: 14px; }
  .wrap { width: 1900px; }
</style>
<body>
<div class="wrap">
  <!-- COLUMN TEMPLATE x2 -->
  <section class="col" data-n="pingsell/b" data-title="Pingsell"></section>
  <section class="col" data-n="pingsell/a" data-title="Pingsell"></section><section class="col" data-n="pingsell/c" data-title="Pingsell"></section>
</div>
<script>
  const fit = () => (document.body.style.zoom = Math.min(1, innerWidth / 1900));
  addEventListener("resize", fit); fit();
  for (const col of document.querySelectorAll(".col")) {
    const n = col.dataset.n, T = col.dataset.title;
    col.innerHTML = `
      <h2>${T}<span>.</span> <small style="font-size:14px;color:#64748b">piste ${n.slice(-1).toUpperCase()}</small></h2>
      <p class="lbl">Dans l'app</p>
      <div class="card app">
        <div class="side"><img src="${n}/logo-dark.svg" alt="">
          <div class="nav"><div class="on">Tableau de bord</div><div>Campagnes</div><div>Automatisations</div><div>Notifications push</div><div>Statistiques</div></div>
        </div>
        <div class="main"><small>TABLEAU DE BORD · 30 DERNIERS JOURS</small>
          <h3>Bonjour,<em>Boutique démo.</em></h3>
          <div class="tiles"><div>Abonnés<b>54</b></div><div>Emails envoyés<b>95</b></div><div>Revenu généré<b>272 €</b></div></div>
        </div>
      </div>
      <p class="lbl">Connexion</p>
      <div class="card login"><img src="${n}/logo.svg" alt=""><p>Connectez-vous à votre espace ${T}</p><div class="field"></div><div class="field"></div><div class="btn">Se connecter</div></div>
      <div class="row2">
        <div><p class="lbl">Sur le téléphone</p>
          <div class="phone">
            <div class="notif"><img src="${n}/app-icon.svg"><div style="flex:1"><div class="t">${T} <span>maintenant</span></div><div class="b">Nouvelle vente : 89 € grâce à « Soldes d'hiver » 🎉</div></div></div>
            <div class="home"><div><i></i>Photos</div><div><i></i>Mail</div><div><img src="${n}/app-icon.svg">${T}</div><div><i></i>Shopify</div><div><i></i>Météo</div><div><i></i>Notes</div><div><i></i>Banque</div><div><i></i>Réglages</div></div>
          </div>
        </div>
        <div><p class="lbl">Navigateur & email</p>
          <div class="card" style="margin:0">
            <div class="tabs"><div class="tab"><i></i>Gmail</div><div class="tab on"><img src="${n}/favicon.svg">${T} — Tableau de bord</div></div>
            <div class="mail">
              <div class="from"><img src="${n}/app-icon.svg"><div><b>${T}</b><span>Votre récap de la semaine : +272 € générés</span></div></div>
              <div class="foot"><img src="${n}/logo.svg"> Envoyé avec ${T}</div>
            </div>
          </div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
