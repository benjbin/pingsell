<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470">
  <rect width="600" height="470" fill="#ffffff"/>
  <rect x="30" y="68" width="140" height="184" rx="18" fill="none" stroke="#ff6a3d" stroke-width="2"/>
  <text x="24" y="34" font-family="Futura, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#0b214a">Rebelote — pistes de logo (round 1)</text>
  <text x="24" y="54" font-family="Futura, Helvetica, sans-serif" font-size="11" fill="#4d82ff">Test : 2 secondes → « encore / ça revient / une vente de plus »</text>

  <g font-family="Futura, Helvetica, sans-serif" font-size="12" fill="#0b214a" text-anchor="middle">
    <!-- A : sac dont l'anse est une flèche retour -->
    <g transform="translate(36,74) scale(2)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#dce6ff"/>
      <path d="M14 27 H50 L52 52 Q52 56 48 56 H16 Q12 56 12 52 Z" fill="#145cff"/>
      <path d="M23 31 V21 A9 9 0 0 1 41 21 V24" fill="none" stroke="#0b214a" stroke-width="5" stroke-linecap="round"/>
      <path d="M35 23 L41 31 L47 23 Z" fill="#0b214a" stroke="#0b214a" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="100" y="226" font-weight="700">A · Sac-boucle ✓ retenu</text>
    <text x="100" y="242" font-size="10" fill="#4d82ff">l'anse du sac est une flèche qui y revient</text>

    <!-- B : R dont la jambe boucle en flèche -->
    <g transform="translate(236,74) scale(2)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#145cff"/>
      <path d="M21 52 V12 H32 A10.5 10.5 0 0 1 32 33 H21" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M31 33 C42 36 49 44 47 51 C45 57 36 58 33 52" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <path d="M27 53 L35 45 L37 56 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="300" y="226" font-weight="700">B · R-retour</text>
    <text x="300" y="242" font-size="10" fill="#4d82ff">la jambe du R revient sur elle-même</text>

    <!-- C : deux sacs ×2 -->
    <g transform="translate(436,74) scale(2)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#dce6ff"/>
      <path d="M22 18 H50 L52 40 Q52 44 48 44 H24 Q20 44 20 40 Z" fill="#4d82ff"/>
      <path d="M29 20 V15 A7 7 0 0 1 43 15 V20" fill="none" stroke="#4d82ff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M14 30 H42 L44 52 Q44 56 40 56 H16 Q12 56 12 52 Z" fill="#145cff"/>
      <path d="M21 32 V27 A7 7 0 0 1 35 27 V32" fill="none" stroke="#145cff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="28" y="49" font-size="11" font-weight="700" fill="#fff">×2</text>
    </g>
    <text x="500" y="226" font-weight="700">C · Deux sacs</text>
    <text x="500" y="242" font-size="10" fill="#4d82ff">la deuxième commande</text>

    <!-- D : enveloppe + boucle -->
    <g transform="translate(36,270) scale(2)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#dce6ff"/>
      <rect x="9" y="17" width="40" height="28" rx="4" fill="#145cff"/>
      <path d="M11 19 L29 33 L47 19" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M49 31 A12 12 0 1 1 37 47" fill="none" stroke="#ff6a3d" stroke-width="5" stroke-linecap="round"/>
      <path d="M31 47 L39 41 L39 53 Z" fill="#ff6a3d" stroke="#ff6a3d" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="100" y="422" font-weight="700">D · Enveloppe-retour</text>
    <text x="100" y="438" font-size="10" fill="#4d82ff">le message qui fait revenir</text>

    <!-- E : bulle dont la queue boucle -->
    <g transform="translate(236,270) scale(2)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#0b214a"/>
      <rect x="10" y="10" width="44" height="32" rx="12" fill="#145cff"/>
      <path d="M22 42 C22 52 14 56 10 50" fill="none" stroke="#145cff" stroke-width="6" stroke-linecap="round"/>
      <path d="M5 52 L10 44 L15 53 Z" fill="#145cff"/>
      <path d="M24 22 H40 L41 35 H23 Z M28 22 V19 A4 4 0 0 1 36 19 V22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <text x="300" y="422" font-weight="700">E · Bulle-retour</text>
    <text x="300" y="438" font-size="10" fill="#4d82ff">la notif dont la queue revient</text>

    <!-- F : belote, roi puis dame -->
    <g transform="translate(436,270) scale(2)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#dce6ff"/>
      <rect x="14" y="12" width="26" height="38" rx="4" fill="#4d82ff" transform="rotate(-12 27 31)"/>
      <rect x="26" y="14" width="26" height="38" rx="4" fill="#145cff" transform="rotate(10 39 33)"/>
      <path d="M38 26 A6 6 0 1 1 33 36" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" transform="rotate(10 39 33)"/>
      <path d="M30 34 L35 31 L35 39 Z" fill="#fff" transform="rotate(10 39 33)"/>
    </g>
    <text x="500" y="422" font-weight="700">F · Belote</text>
    <text x="500" y="438" font-size="10" fill="#4d82ff">roi, puis dame : rebelote</text>
  </g>
  <text x="24" y="462" font-family="Futura, Helvetica, sans-serif" font-size="11" fill="#0b214a">Retenu : A → v2 : panier de marché incliné (bande tressée), boucle corail en cercle vrai, ancrée dans le rebord.</text>
</svg>
