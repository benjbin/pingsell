<!doctype html><html lang="fr"><meta charset="utf-8"><title>Nouveau nom — comparatif</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6fb;color:#0b214a}h1{padding:24px 32px 0;margin:0}
.row{display:grid;grid-template-columns:160px 1fr 1fr 120px 140px;gap:20px;align-items:center;padding:24px 32px;border-bottom:1px solid #dde3f0}
.row h2{margin:0;font-size:22px}.light{background:#fff;border-radius:16px;padding:24px;height:90px;display:flex;align-items:center}
.dark{background:#0b214a;border-radius:16px;padding:24px;height:90px;display:flex;align-items:center}.light img,.dark img{height:56px;max-width:100%}
.app img{width:110px}.fav{display:flex;gap:12px;align-items:end}.c{grid-column:1/-1;background:#fff;border-radius:12px;padding:8px}.c img{width:100%;max-height:220px;object-fit:contain}</style>
<h1>Nouveau nom — 3 finalistes</h1>
<div class="row"><h2>plico</h2><div class="light"><img src="plico/logo.svg"></div><div class="dark"><img src="plico/logo-dark.svg"></div><div class="app"><img src="plico/app-icon.svg"></div><div class="fav"><img src="plico/favicon.svg" width="16"><img src="plico/favicon.svg" width="32"><img src="plico/icon.svg" width="64"></div><div class="c"><img src="plico/concepts.svg"></div></div>
<div class="row"><h2>navette</h2><div class="light"><img src="navette/logo.svg"></div><div class="dark"><img src="navette/logo-dark.svg"></div><div class="app"><img src="navette/app-icon.svg"></div><div class="fav"><img src="navette/favicon.svg" width="16"><img src="navette/favicon.svg" width="32"><img src="navette/icon.svg" width="64"></div><div class="c"><img src="navette/concepts.svg"></div></div>
<div class="row"><h2>ondio</h2><div class="light"><img src="ondio/logo.svg"></div><div class="dark"><img src="ondio/logo-dark.svg"></div><div class="app"><img src="ondio/app-icon.svg"></div><div class="fav"><img src="ondio/favicon.svg" width="16"><img src="ondio/favicon.svg" width="32"><img src="ondio/icon.svg" width="64"></div><div class="c"><img src="ondio/concepts.svg"></div></div>
